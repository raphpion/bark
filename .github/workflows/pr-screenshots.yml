name: UI Screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/sidepanel/**'
      - 'src/hub/**'
      - 'src/palette/**'
      - 'src/shared/**'
      - 'scripts/generate-screenshots.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-screenshots:
    name: Check & update store screenshots
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Build extension
        run: npm run build

      - name: Generate screenshots
        run: npm run screenshots

      - name: Commit changes to PR branch if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store-assets/
          if git diff --cached --quiet; then
            echo "Screenshots are up to date."
          else
            echo "Visual changes detected! Committing updated screenshots to PR..."
            git commit -m "chore(store): update screenshots for UI changes [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

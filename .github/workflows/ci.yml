name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    name: Validate PR labels & patch notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify PR metadata
        run: node scripts/verify-pr.mjs

  check:
    name: Typecheck, unit tests & build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck & hardening checks
        run: npm run check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build extension
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: bark-dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E tests (Playwright + Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Run E2E tests (builds dist/ first)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

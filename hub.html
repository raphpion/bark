<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bark — Spaces, Archive & Downloads</title>
    <link rel="stylesheet" href="/src/shared/commonStyles.css" />
    <link rel="stylesheet" href="/src/hub/styles.css" />
  </head>
  <body>
    <div class="bark-hub-layout">
      <!-- Left Navigation Rail ([image 8]) -->
      <aside class="bark-hub-rail">
        <div class="bark-hub-brand" title="Bark">
          <img src="/icons/icon48.png" alt="Bark" class="bark-hub-logo" />
        </div>

        <nav class="bark-hub-nav">
          <button type="button" class="bark-rail-btn" data-section="archive">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="5" x="2" y="3" rx="1"/>
              <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
              <path d="M10 12h4"/>
            </svg>
            <span>Archived Tabs</span>
          </button>

          <button type="button" class="bark-rail-btn" data-section="downloads">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
            </svg>
            <span>Downloads</span>
          </button>

          <button type="button" class="bark-rail-btn active" data-section="spaces">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect width="12" height="16" x="4" y="4" rx="2"/>
              <path d="M16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8"/>
            </svg>
            <span>Spaces</span>
          </button>

          <button type="button" class="bark-rail-btn" data-section="settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>Settings</span>
          </button>
        </nav>
      </aside>

      <!-- Main Viewport -->
      <main id="hub-main-content" class="bark-hub-main"></main>
    </div>

    <script type="module" src="/src/hub/main.tsx"></script>
  </body>
</html>
